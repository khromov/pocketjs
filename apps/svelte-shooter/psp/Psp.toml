# XMB metadata for the PocketJS Svelte Shooter EBOOT. tools/psp.ts copies this to
# programs/psp/Psp.toml when building this demo (any framework); cargo-psp packs
# it into PARAM.SFO / ICON0 / PIC1.
# Regenerate the art with: bun tools/gen-demo-covers.ts svelte-shooter
title = "PocketJS Svelte Shooter"
xmb_icon_png = "icon0.png"
xmb_background_png = "pic1.png"

# PocketJS host policy, stripped by tools/psp.ts before cargo-psp reads this
# file: present at 30 Hz with two 60 Hz core ticks per frame. On a PSP-1000 a
# frame of this app misses the 16.7 ms vblank budget, and at 60 Hz every miss
# shows as half-speed play (docs/DETERMINISM.md).
pocketjs_sim_hz = 30
